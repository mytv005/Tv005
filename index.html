<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiKON-tv ULTRA V65 | Fixed Audio</title>
    <style>
        :root {
            --bg: #020617;
            --sidebar: #0f172a;
            --primary: #2563eb;
            --bein: #7c3aed;
            --arabic: #10b981;
            --doc: #f59e0b;
            --accent: #facc15;
            --text: #f8fafc;
            --danger: #ef4444;
            --highlight: #059669;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: linear-gradient(90deg, var(--sidebar), #1e293b); padding: 8px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #334155; flex-shrink: 0; height: 55px; }
        body.fullscreen .header { display: none !important; }

        .search-bar { flex: 1; background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 1rem; transition: all 0.3s ease; }
        .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(37, 99, 235, 0.4); background: #0f172a; }
        
        .player-area { position: relative; width: 100%; background: #000; flex: 0 0 55vh; border-bottom: 3px solid var(--primary); overflow: hidden; transition: all 0.3s ease; }
        
        body.cinema-mode .player-area { flex: 1 !important; border-bottom: none; }
        body.cinema-mode .main-ui, body.cinema-mode .header { display: none !important; }

        body.fullscreen .player-area { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; flex: 1 !important; border: none; z-index: 9999; }
        body.fullscreen .main-ui, body.fullscreen .header { display: none !important; }

        iframe { width: 100%; height: 100%; border: none; z-index: 1; }

        /* شعار الدرع - غير قابل للاعتراض بصرياً وقدرة اللمس ملغاة منه لعدم تعطيل الفيديو */
        .kikon-shield {
            position: absolute; top: 0; right: 0; width: 320px; height: 95px; 
            background: linear-gradient(135deg, #020617, #1e293b); z-index: 150;
            display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 900; font-size: 1.3rem;
            border-bottom-left-radius: 20px; border: 1px solid rgba(255,255,255,0.1); 
            pointer-events: none; /* 👈 يمنع الدرع من حظر النقرات */
            box-shadow: -5px 5px 25px rgba(0,0,0,0.9);
        }

        .player-tools { position: absolute; top: 10px; left: 10px; z-index: 200; display: flex; gap: 6px; flex-wrap: wrap; }
        .tool-btn {
            background: rgba(15, 23, 42, 0.85); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 10px;
            border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--primary); border-color: var(--accent); transform: translateY(-2px); }
        .tool-btn:active { transform: scale(0.95); }

        /* 🔥 الإصلاح الجوهري هنا: قص منطقة اللمس السفلية بنسبة 15% للسماح بالضغط على زر الصوت بدون أي عائق */
        #adBreaker { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 100; 
            background: rgba(0,0,0,0.01); 
            cursor: pointer; 
            display: none;
            clip-path: inset(0 0 15% 0); /* 👈 يلغي تفاعل القناع تماماً في الـ 15% السفلية */
        }

        #soundTip {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.85);
            color: var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; z-index: 160;
            pointer-events: none; border: 1px solid var(--accent); display: none; animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }

        .main-ui { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 170px; background: var(--sidebar); border-left: 2px solid #334155; display: flex; flex-direction: column; height: 100%; }
        #regSide { flex: 1; overflow-y: auto; }

        .secret-box-btn { 
            width: 100%; height: 35px; background: var(--sidebar); cursor: pointer; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .secret-square { width: 6px; height: 6px; background: #1e293b; border-radius: 50%; transition: all 0.3s; }
        .secret-box-btn:hover .secret-square { background: #334155; }
        .secret-box-btn.unlocked .secret-square { background: var(--doc); box-shadow: 0 0 8px var(--doc); }

        .group-btn { width: 100%; padding: 18px 12px; background: transparent; border: none; color: #94a3b8; text-align: right; cursor: pointer; font-weight: bold; border-bottom: 1px solid #334155; font-size: 0.85rem; transition: background 0.2s; }
        .group-btn.active { background: var(--primary); color: white; border-right: 5px solid var(--accent); }
        .group-btn.bein-p { background: var(--bein); color: white; }
        .group-btn.ara-g { background: var(--arabic); color: white; }

        .grid-container { flex: 1; height: 100%; overflow-y: auto; padding: 10px; position: relative; background: var(--bg); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; padding-bottom: 40px; }
        
        .ch-card { 
            background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border: 1px solid #334155; padding: 10px 5px; border-radius: 12px; 
            cursor: pointer; font-size: 0.75rem; font-weight: bold; text-align: center; min-height: 55px; 
            display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .ch-card:hover { background: linear-gradient(135deg, #2563eb, #1e40af); border-color: var(--accent); transform: translateY(-2px); }
        .ch-card.active { background: var(--highlight); border-color: white; box-shadow: 0 0 10px rgba(5, 150, 105, 0.5); }

        #keypadLock {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .pin-display { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; color: var(--accent); font-weight: bold; }
        .key-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .key { width: 65px; height: 60px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; color: white; user-select: none; transition: transform 0.1s; }
        .key:active { background: var(--primary); transform: scale(0.92); }
        .key.clear-btn { border-color: var(--danger); color: var(--danger); }

        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:900; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) { 
            .sidebar { width: 110px; } 
            .grid { grid-template-columns: repeat(3, 1fr); } 
            .player-area { flex: 0 0 38vh; } 
            .kikon-shield { width: 250px; height: 75px; font-size: 1rem; } 
        }
    </style>
</head>
<body onclick="enableGlobalAudio()">

<div class="header">
    <div style="color:var(--accent); font-weight:900;">KiKON-tv</div>
    <input type="text" id="searchBox" class="search-bar" placeholder="بحث في القنوات..." oninput="doSearch()">
</div>

<div class="player-area">
    <div id="loader"><div style="border:3px solid #fff; border-top:3px solid var(--primary); border-radius:50%; width:30px; height:30px; animation: spin 1s linear infinite;"></div></div>
    
    <div class="kikon-shield">KiKON-tv</div>
    
    <div class="player-tools">
        <button class="tool-btn" onclick="prevChannel()" title="القناة السابقة">⏮️ السابقة</button>
        <button class="tool-btn" onclick="nextChannel()" title="القناة التالية">⏭️ التالية</button>
        <button class="tool-btn" onclick="toggleCinema()" title="وضع السينما">🎬 سينما</button>
        <button class="tool-btn" onclick="toggleFullScreen()" title="ملء الشاشة">🖥️ الشاشة كاملة</button>
        <button class="tool-btn" onclick="refreshStream()" title="تحديث البث">🔄 تحديث</button>
    </div>

    <div id="soundTip">🔊 اضغط على أيقونة الصوت بالأسفل</div>
    <div id="adBreaker" onclick="handleAdClick()"></div>
    <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer"></iframe>
</div>

<div class="main-ui">
    <div class="sidebar" id="side">
        <button id="secretLock" class="secret-box-btn" onclick="openSecret()">
            <div class="secret-square"></div>
        </button>
        <div id="regSide"></div>
    </div>
    <div class="grid-container">
        <div id="keypadLock">
            <div class="pin-display" id="pinDots">----</div>
            <div class="key-row">
                <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
            </div>
            <div class="key-row">
                <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
            </div>
            <div class="key-row">
                <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
            </div>
            <div class="key-row">
                <div class="key" onclick="press('0')">0</div>
                <div class="key clear-btn" onclick="cls()">C</div>
            </div>
        </div>
        <div class="grid" id="grid"></div>
    </div>
</div>

<script>

    ],

    ],
    "🇺🇸 General": [
        {name:"ABC USA",id:51},{name:"AHC",id:206},{name:"Antenna",id:283},{name:"A&E",id:302},{name:"AMC",id:303},{name:"Animal Plan",id:304},{name:"Kids TV",id:295},{name:"AXS TV",id:742},{name:"ABC NY",id:766},{name:"BB America",id:305},{name:"BET USA",id:306},{name:"Bravo USA",id:307},{name:"CW PIX 11",id:280},{name:"CBS USA",id:52},{name:"Court TV",id:281},{name:"CW USA",id:300},{name:"CNBC USA",id:309},{name:"Comedy Cent",id:310},{name:"Cartoon Net",id:339},{name:"CNN USA",id:345},{name:"Cinemax",id:374},{name:"COZI TV",id:748},{name:"CMT USA",id:647},{name:"CTV Canada",id:602},{name:"CTV 2 CA",id:838},{name:"Crime+",id:669},{name:"Comet USA",id:696},{name:"Cooking Ch",id:697},{name:"Cleo TV",id:715},{name:"C SPAN 1",id:750},{name:"CBSNY USA",id:767},{name:"Disc. Life",id:311},{name:"Disney Ch",id:312},{name:"Discovery",id:313},{name:"Disc. Family",id:657},{name:"Disney XD",id:314},{name:"Dest. Am",id:651},{name:"Disney JR",id:652},{name:"BB S28 C1",id:891},{name:"BB S28 C2",id:892},{name:"BB S28 C3",id:893},{name:"BB S28 C4",id:894},{name:"BB Quad",id:895},{name:"MSNBC",id:327},{name:"Magnolia",id:299},{name:"MTV USA",id:371},{name:"MY9TV USA",id:654},{name:"METV USA",id:662},{name:"MGM+ USA",id:791},{name:"NewsNation",id:292},{name:"Nat Geo",id:328},{name:"NICK JR",id:329},{name:"NICK",id:330},{name:"Nicktoons",id:649},{name:"Newsmax",id:613},{name:"Nat Geo Wild",id:745},{name:"Noovo CA",id:835},{name:"NBC Univ",id:845},{name:"OWN Channel",id:331},{name:"Oxygen Crime",id:332},{name:"Paramount",id:334},{name:"POP TV",id:653},{name:"PBS USA",id:210},{name:"Reelz Ch",id:293},{name:"Starz Cine",id:970},{name:"Starz Com",id:971},{name:"Starz Edge",id:972},{name:"Starz Black",id:973},{name:"Starz Kids",id:974},{name:"Starz Encore",id:975},{name:"Encore Act",id:976},{name:"Encore Black",id:977},{name:"Encore Class",id:978},{name:"Encore Fam",id:979},{name:"Encore Susp",id:980},{name:"Encore West",id:981},{name:"Hallmark",id:320},{name:"TBS USA",id:336},{name:"TLC Ch",id:337},{name:"TNT USA",id:338},{name:"Travel Ch",id:340},{name:"TruTV USA",id:341},{name:"TVLAND",id:342},{name:"TCM USA",id:644},{name:"TMC USA",id:698},{name:"Food Net",id:384},{name:"Weather Ch",id:394},{name:"TeenNick",id:650},{name:"TV ONE",id:660},{name:"TVO CA",id:842},{name:"USA Network",id:343},{name:"Univ Kids",id:668},{name:"VH1 USA",id:344},{name:"VICE TV",id:659},{name:"WETV USA",id:655}
    ],
    "SecretDocs": [ 
        {name:"History 1",id:502},{name:"History 2",id:503},{name:"Discovery Ch",id:504},{name:"Investig.",id:505},{name:"Science Ch",id:506},{name:"Heroes Ch",id:507},{name:"Destination",id:508},{name:"Disc. Life",id:509},{name:"Disc. Fam",id:510},{name:"Nat Geo USA",id:511},{name:"Nat Geo Wild",id:512},{name:"Smithson",id:513},{name:"Animal Plan",id:514},{name:"Travel Ch",id:515},{name:"Food Net",id:516},{name:"HGTV USA",id:517},{name:"Magnolia Net",id:518},{name:"Cooking Ch",id:519},{name:"FYI Channel",id:520}
    ]
};

const regSide = document.getElementById('regSide');
const grid = document.getElementById('grid');
const player = document.getElementById('mainPlayer');
const loader = document.getElementById('loader');
const secretBtn = document.getElementById('secretLock');
const keypad = document.getElementById('keypadLock');
const pinDots = document.getElementById('pinDots');
const soundTip = document.getElementById('soundTip');

let pin = "";
let isUnlocked = false;
let currentCat = "🟣 beIN Sports";
let currentStreamId = null;
let currentChannelIndex = -1;
let isClickLocked = false;
let soundTipTimer = null;

function init() {
    Object.keys(allData).forEach((cat) => {
        if(cat === "SecretDocs") return;
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        if(cat.includes('beIN')) btn.classList.add('bein-p');
        if(cat.includes('Arabic')) btn.classList.add('ara-g');
        btn.innerText = cat;
        btn.onclick = () => selectCat(cat, btn);
        regSide.appendChild(btn);
    });
    regSide.firstChild.click();
}

function selectCat(cat, btn) {
    document.querySelectorAll('.group-btn, .secret-box-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = cat;
    keypad.style.display = 'none';
    grid.style.display = 'grid';
    renderGrid(allData[cat]);
}

function openSecret() {
    document.querySelectorAll('.group-btn, .secret-box-btn').forEach(b => b.classList.remove('active'));
    secretBtn.classList.add('active');
    currentCat = "SecretDocs";
    if(!isUnlocked) {
        grid.style.display = 'none';
        keypad.style.display = 'flex';
        cls();
    } else {
        grid.style.display = 'grid';
        renderGrid(allData["SecretDocs"]);
    }
}

function press(n) {
    pin += n;
    pinDots.innerText = "*".repeat(pin.length) + "-".repeat(4 - pin.length);
    if(pin === "1986") {
        isUnlocked = true;
        secretBtn.classList.add('unlocked');
        keypad.style.display = 'none';
        grid.style.display = 'grid';
        renderGrid(allData["SecretDocs"]);
    } else if (pin.length >= 4) { cls(); }
}

function cls() { pin = ""; pinDots.innerText = "----"; }

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach((ch, index) => {
        const div = document.createElement('div');
        div.className = 'ch-card';
        div.innerText = ch.name;
        div.onclick = () => playChannel(ch.id, div, index);
        grid.appendChild(div);
    });
}

function playChannel(id, el, index) {
    if (isClickLocked) return;
    isClickLocked = true;
    setTimeout(() => { isClickLocked = false; }, 1200);

    document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
    if(el) el.classList.add('active');
    
    currentStreamId = id;
    if(typeof index !== 'undefined') currentChannelIndex = index;

    loader.style.display = 'flex';
    document.getElementById('adBreaker').style.display = 'block';
    
    if (soundTipTimer) clearTimeout(soundTipTimer);
    soundTip.style.display = 'block';
    soundTipTimer = setTimeout(() => {
        soundTip.style.display = 'none';
    }, 6000);
    
    player.src = "https://dlhd.st/embed/stream-" + id + ".php";
    
    setTimeout(() => { 
        loader.style.display = 'none';
        enableGlobalAudio();
    }, 1500);
}

function enableGlobalAudio() {
    if (player && player.contentWindow) {
        try {
            player.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        } catch(e) {}
    }
}

function handleAdClick() {
    document.getElementById('adBreaker').style.display = 'none';
    enableGlobalAudio();
}

function nextChannel() {
    const channelList = allData[currentCat];
    if (!channelList || channelList.length === 0) return;
    
    currentChannelIndex = (currentChannelIndex + 1) % channelList.length;
    const nextCh = channelList[currentChannelIndex];
    const cards = document.querySelectorAll('.ch-card');
    playChannel(nextCh.id, cards[currentChannelIndex] || null, currentChannelIndex);
}

function prevChannel() {
    const channelList = allData[currentCat];
    if (!channelList || channelList.length === 0) return;
    
    currentChannelIndex = (currentChannelIndex - 1 + channelList.length) % channelList.length;
    const prevCh = channelList[currentChannelIndex];
    const cards = document.querySelectorAll('.ch-card');
    playChannel(prevCh.id, cards[currentChannelIndex] || null, currentChannelIndex);
}

function toggleCinema() {
    document.body.classList.remove('fullscreen');
    document.body.classList.toggle('cinema-mode');
}

function toggleFullScreen() {
    document.body.classList.remove('cinema-mode');
    document.body.classList.toggle('fullscreen');
}

function refreshStream() {
    if(currentStreamId) {
        isClickLocked = false;
        playChannel(currentStreamId, null, currentChannelIndex);
    }
}

function doSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase().trim();
    if (q === "") {
        const activeBtn = document.querySelector('.group-btn.active') || secretBtn;
        if(currentCat === "SecretDocs") openSecret(); else selectCat(currentCat, activeBtn);
        return;
    }
    keypad.style.display = 'none'; grid.style.display = 'grid';
    grid.innerHTML = "";
    Object.keys(allData).forEach(k => {
        if (k === "SecretDocs" && !isUnlocked) return;
        allData[k].forEach((ch, idx) => {
            if(ch.name.toLowerCase().includes(q)) {
                const div = document.createElement('div'); 
                div.className = 'ch-card'; 
                div.innerText = ch.name;
                div.onclick = () => playChannel(ch.id, div, idx);
                grid.appendChild(div);
            }
        });
    });
}
window.onload = init;
</script>
</body>
</html>
