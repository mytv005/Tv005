        }

        #adBreaker { position: absolute; top: 0; left: 0; width: 100%; height: 65%; z-index: 100; background: rgba(0,0,0,0.01); cursor: pointer; display: none; }

        .player-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 45px;
            background: rgba(15, 23, 42, 0.95); z-index: 160; display: flex; align-items: center;
            justify-content: space-between; padding: 0 10px; border-top: 1px solid #334155; overflow-x: auto;
        }

        .control-group { display: flex; align-items: center; gap: 6px; }
        .ctrl-btn { background: #1e293b; color: var(--text); border: 1px solid #475569; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .ctrl-btn:hover, .ctrl-btn:focus { background: var(--primary); border-color: var(--accent); outline: none; }

        .main-ui { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 210px; background: var(--sidebar); border-left: 2px solid #334155; display: flex; flex-direction: column; height: 100%; }

        .secret-box-btn.unlocked .secret-square { background: #ec4899; box-shadow: 0 0 8px #ec4899; }

        .group-btn.active { filter: brightness(1.25); border-right: 5px solid var(--accent); }

function init() {
    regSide.innerHTML = "";

        const btn = document.createElement('button');
        btn.className = 'group-btn';

        btn.innerText = cat;
        btn.onclick = () => selectCat(cat, btn);
        regSide.appendChild(btn);
    });
    if (regSide.firstChild) regSide.firstChild.click();

function switchView(mode) {
    viewMode = mode;
    document.getElementById('btnCh').classList.toggle('active', mode === 'channels');
    document.getElementById('btnMatches').classList.toggle('active', mode === 'matches');
    if(mode === 'channels') {
        matchesContainer.style.display = 'none';
        grid.style.display = 'grid';
        document.getElementById('side').style.display = 'flex';
    } else {
        grid.style.display = 'none';
        keypad.style.display = 'none';
        matchesContainer.style.display = 'block';
        document.getElementById('side').style.display = 'none';
        loadRealMatches();
    }
}

    const l = leagueName.toLowerCase();
    if (l.includes("premier league") || l.includes("english")) {
        const beIN = [{name:"beIN Sports 1 Arabic", id:91}, {name:"beIN Sports 2 Arabic", id:92}, {name:"beIN Sports 3 Arabic", id:93}];
        return [beIN[index % beIN.length], {name:"Sky sports Premier League", id:130}, {name:"TNT Sports 1 UK", id:31}];

    else if (l.includes("la liga") || l.includes("spanish")) {
        const beIN = [{name:"beIN Sports 3 Arabic", id:93}, {name:"beIN Sports 1 Arabic", id:91}, {name:"beIN Sports 4 Arabic", id:94}];
        return [beIN[index % beIN.length], {name:"Movistar Laliga", id:84}, {name:"DAZN 1 Spain", id:445}];

        const today = new Date().toISOString().split('T')[0];
        const res = await fetch("https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=" + today + "&s=Soccer");
        const data = await res.json();
        
        matchesContainer.innerHTML = "";
        if(!data.events || data.events.length === 0) {
            matchesContainer.innerHTML = "<div style='text-align:center;padding:20px;'>لا توجد مباريات مسجلة اليوم.</div>";
            return;
        }

        data.events.forEach((match, index) => {
            const card = document.createElement('div');
            card.className = 'match-card';
            const channels = getMatchChannels(match.strLeague || "", index);
            let buttonsHTML = "";
            channels.forEach(ch => {
                buttonsHTML += `<button class="match-ch-btn" onclick="playChannelDirect(${ch.id})">📺 ${ch.name}</button>`;
            });

            card.innerHTML = `
                <div class="match-header">
                    <span class="match-league">${match.strLeague || "مباراة جديدة"}</span>
                    <span class="match-time">${match.strTime ? match.strTime.substring(0,5) : 'اليوم'}</span>
                </div>
                <div class="match-teams">${match.strEvent}</div>
                <div class="match-channels">${buttonsHTML}</div>
            `;
            matchesContainer.appendChild(card);
        });
    } catch(e) {
        matchesContainer.innerHTML = "<div style='text-align:center;padding:20px;'>تعذر اتصال API، يرجى المحاولة لاحقاً.</div>";
    }
}

function playChannelDirect(id) {
    switchView('channels');
    playChannel(id, null);
}

function selectCat(cat, btn) {
    document.querySelectorAll('.group-btn, .secret-box-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    currentCat = cat;
    keypad.style.display = 'none'; grid.style.display = 'grid';
    renderGrid(allData[cat]);
}

function openSecret() {
    document.querySelectorAll('.group-btn, .secret-box-btn').forEach(b => b.classList.remove('active'));
    secretBtn.classList.add('active');
    currentCat = "🔒 Secret";
    if(!isUnlocked) {
        grid.style.display = 'none'; keypad.style.display = 'flex'; cls();
    } else {
        grid.style.display = 'grid'; renderGrid(allData["🔒 Secret"]);
    }
}

function press(n) {
    if(pin.length < 4) { pin += n; pinDots.innerText = "*".repeat(pin.length) + "-".repeat(4 - pin.length); }
    if(pin === SECRET_PIN) {
        isUnlocked = true; secretBtn.classList.add('unlocked');
        keypad.style.display = 'none'; grid.style.display = 'grid';
        renderGrid(allData["🔒 Secret"]);
    } else if (pin.length >= 4) { setTimeout(cls, 300); }
}

function cls() { pin = ""; pinDots.innerText = "----"; }

function renderGrid(list) {
    grid.innerHTML = "";
    if(!list) return;
    list.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = 'ch-card'; div.innerText = ch.name; div.tabIndex = 0;
        div.onclick = () => { currentChannelIndex = idx; playChannel(ch.id, div); };
        grid.appendChild(div);
    });
}

function playChannel(id, el) {
    document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
    if(el) el.classList.add('active');
    loader.style.display = 'flex';
    document.getElementById('adBreaker').style.display = 'block';
    savedSrc = "https://dlhd.st/embed/stream-" + id + ".php";
    player.src = savedSrc;
    playPauseBtn.innerText = "⏸️ إيقاف";
    setTimeout(() => { loader.style.display = 'none'; }, 1200);
}

function togglePlayPause() {
    if (player.src !== "") { savedSrc = player.src; player.src = ""; playPauseBtn.innerText = "▶️ تشغيل"; }
    else if (savedSrc !== "") { player.src = savedSrc; playPauseBtn.innerText = "⏸️ إيقاف"; }
}

function reloadChannel() {
    if (savedSrc) { loader.style.display = 'flex'; player.src = savedSrc; setTimeout(() => { loader.style.display = 'none'; }, 1000); }
}

function nextChannel() {
    const list = allData[currentCat];
    if (!list || list.length === 0) return;
    currentChannelIndex = (currentChannelIndex + 1) % list.length;
    playChannel(list[currentChannelIndex].id, grid.children[currentChannelIndex]);
}

function prevChannel() {
    const list = allData[currentCat];
    if (!list || list.length === 0) return;
    currentChannelIndex = (currentChannelIndex - 1 + list.length) % list.length;
    playChannel(list[currentChannelIndex].id, grid.children[currentChannelIndex]);
}

function toggleCinemaMode() { playerContainer.classList.toggle('cinema-mode'); }
function toggleFullScreen() {
    if (!document.fullscreenElement) { playerContainer.requestFullscreen ? playerContainer.requestFullscreen() : playerContainer.webkitRequestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
}

function doSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase().trim();
    if (q === "") { selectCat(currentCat, document.querySelector('.group-btn.active')); return; }
    keypad.style.display = 'none'; grid.style.display = 'grid'; grid.innerHTML = "";
    Object.keys(allData).forEach(k => {
        if(k === "🔒 Secret" && !isUnlocked) return;
        allData[k].forEach(ch => {
            if(ch.name.toLowerCase().includes(q)) {
                const div = document.createElement('div');
                div.className = 'ch-card'; div.innerText = ch.name;
                div.onclick = () => playChannel(ch.id, div);
                grid.appendChild(div);
            }
        });
    });
}

window.onload = init;
</script>
</body>
</html>
