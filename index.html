<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiKON-tv ULTRA | Full Screen Optimized</title>
    <style>
        :root {
            --bg: #020617;
            --sidebar: #0f172a;
            --primary: #2563eb;
            --bein: #7c3aed;
            --arabic: #10b981;
            --doc: #f59e0b;
            --accent: #facc15;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* الهيدر */
        .header { background: var(--sidebar); padding: 8px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #334155; flex-shrink: 0; }
        .search-bar { flex: 1; background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 1rem; }
        
        /* منطقة المشغل - مكبرة لتشغل نصف الشاشة */
        .player-container { 
            position: relative; 
            width: 100%; 
            background: #000; 
            flex: 0 0 55vh; /* تشغل 55% من ارتفاع الشاشة */
            border-bottom: 3px solid var(--primary);
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* شعار KiKON-tv - تم ضبطه بدقة ليغطي الإعلان */
        .kikon-shield {
            position: absolute;
            top: 0; right: 0;
            width: 38%; height: 26%;
            background: linear-gradient(145deg, #0f172a, #020617);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-weight: 900; font-size: 1.4rem;
            border-bottom-left-radius: 25px;
            border-left: 3px solid var(--primary); border-bottom: 3px solid var(--primary);
            pointer-events: none;
            box-shadow: -10px 10px 25px rgba(0,0,0,0.9);
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        /* واجهة الباقات والقنوات - تمتد لتملأ باقي الشاشة */
        .main-ui { 
            flex: 1; /* تأخذ كل المساحة المتبقية في الأسفل */
            display: flex; 
            overflow: hidden; 
        }
        
        .sidebar { width: 170px; background: var(--sidebar); border-left: 2px solid #334155; overflow-y: auto; height: 100%; }
        .group-btn { width: 100%; padding: 16px 12px; background: transparent; border: none; color: #94a3b8; text-align: right; cursor: pointer; font-weight: bold; border-bottom: 1px solid #334155; font-size: 0.9rem; transition: 0.2s; }
        .group-btn.active, .group-btn:focus { background: var(--primary); color: white; outline: none; border-right: 5px solid var(--accent); }

        .group-btn.bein-p { background: var(--bein); color: white; }
        .group-btn.ara-g { background: var(--arabic); color: white; }
        .group-btn.doc-g { background: var(--doc); color: #000; }

        .grid-container { flex: 1; height: 100%; overflow-y: auto; padding: 12px; background: var(--bg); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding-bottom: 30px; }
        
        .ch-card { background: #1e293b; color: white; border: 1px solid #334155; padding: 12px 5px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: bold; text-align: center; min-height: 60px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .ch-card:focus { background: var(--primary); border-color: var(--accent); outline: none; transform: scale(1.05); }
        .ch-card.active { background: #059669; border-color: white; box-shadow: 0 4px 12px rgba(5,150,105,0.4); }

        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:900; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .sidebar { width: 110px; }
            .grid { grid-template-columns: repeat(3, 1fr); }
            .player-container { flex: 0 0 35vh; }
            .kikon-shield { font-size: 1rem; width: 45%; }
        }
    </style>
</head>
<body>

<div class="header">
    <div style="color:var(--accent); font-weight:900;">KiKON-tv</div>
    <input type="text" id="searchBox" class="search-bar" placeholder="بحث في 189 قناة..." oninput="doSearch()">
</div>

<div class="player-container">
    <div id="loader"><div style="border:4px solid #334155; border-top:4px solid var(--primary); border-radius:50%; width:35px; height:35px; animation:spin 1s linear infinite;"></div></div>
    <div class="kikon-shield">KiKON-tv</div>
    <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media" referrerpolicy="no-referrer"></iframe>
</div>

<div class="main-ui">
    <div class="sidebar" id="side"></div>
    <div class="grid-container">
        <div class="grid" id="grid"></div>
    </div>
</div>

<script>
// القائمة الكاملة المدمجة (189+ قناة)
const allData = {
    "🇺🇸 USA General": [
        {name:"ABC USA",id:51},{name:"CBS USA",id:52},{name:"FOX USA",id:53},{name:"AMC USA",id:303},{name:"A&E USA",id:302},{name:"CNN USA",id:345},{name:"MSNBC",id:327},{name:"CW USA",id:300},{name:"Disney Ch",id:312},{name:"Discovery",id:313},{name:"Bravo USA",id:307},{name:"BET USA",id:306},{name:"Comedy Cent",id:310},{name:"Adult Swim",id:295},{name:"AXS TV",id:742},{name:"Antenna TV",id:283},{name:"BB S28 C1",id:891},{name:"BB S28 C2",id:892},{name:"BB S28 C3",id:893}
    ],
    "🇺🇸 USA Sports": [
        {name:"ESPN USA",id:44},{name:"ESPN2 USA",id:45},{name:"NBC Sports",id:769},{name:"NFL Net",id:405},{name:"NBA TV",id:404},{name:"MLB Net",id:399},{name:"TSN 1",id:111},{name:"TSN 2",id:112},{name:"TSN 3",id:113},{name:"TSN 4",id:114},{name:"TSN 5",id:115},{name:"Sportsnet",id:406},{name:"Tennis Ch",id:40},{name:"RDS CA",id:839},{name:"TUDN USA",id:66}
    ],
    "🌍 وثائقية": [
        {name:"History 1",id:502},{name:"History 2",id:503},{name:"Discovery",id:504},{name:"Investigation",id:505},{name:"Science",id:506},{name:"Nat Geo USA",id:511},{name:"Nat Geo Wild",id:512},{name:"Animal Planet",id:514},{name:"Travel Ch",id:515},{name:"Food Net",id:516},{name:"Cooking Ch",id:519}
    ],
    "🟣 beIN Sports": [
        {name:"beIN Sport 1",id:91},{name:"beIN Sport 2",id:92},{name:"beIN Sport 3",id:93},{name:"beIN Sport 4",id:94},{name:"beIN Sport 5",id:95},{name:"beIN Sport 6",id:96},{name:"beIN Sport 7",id:97},{name:"beIN Sport 8",id:98},{name:"beIN Sport 9",id:99},{name:"beIN Eng 1",id:61},{name:"beIN Eng 2",id:90},{name:"beIN XTRA 1",id:100},{name:"beIN MAX AR",id:597}
    ],
    "🟢 Arabic & SSC": [
        {name:"SSC Sport 1",id:614},{name:"SSC Sport 2",id:615},{name:"SSC Sport 3",id:616},{name:"SSC Sport 4",id:617},{name:"SSC Sport 5",id:618},{name:"AD Prem 1",id:609},{name:"AD Prem 2",id:610},{name:"Alkass One",id:781},{name:"OnTime Sp",id:611},{name:"Dubai Sp 1",id:604}
    ]
};

const side = document.getElementById('side');
const grid = document.getElementById('grid');
const player = document.getElementById('mainPlayer');
const loader = document.getElementById('loader');

function init() {
    Object.keys(allData).forEach((cat) => {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        if(cat.includes('beIN')) btn.classList.add('bein-p');
        if(cat.includes('Arabic')) btn.classList.add('ara-g');
        if(cat.includes('وثائقية')) btn.classList.add('doc-g');
        btn.innerText = cat;
        btn.onclick = () => {
            document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid(allData[cat]);
        };
        side.appendChild(btn);
    });
    side.firstChild.click();
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(ch => {
        const div = document.createElement('div');
        div.className = 'ch-card';
        div.tabIndex = 0; 
        div.innerText = ch.name;
        div.onclick = () => playChannel(ch.id, div);
        div.onkeydown = (e) => { if(e.key === "Enter") playChannel(ch.id, div); };
        grid.appendChild(div);
    });
}

function playChannel(id, el) {
    document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
    if(el) el.classList.add('active');
    loader.style.display = 'flex';
    player.src = "https://dlhd.st/embed/stream-" + id + ".php";
    setTimeout(() => { loader.style.display = 'none'; }, 1500);
}

function doSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    grid.innerHTML = "";
    Object.keys(allData).forEach(k => {
        allData[k].forEach(ch => {
            if(ch.name.toLowerCase().includes(q)) {
                const div = document.createElement('div');
                div.className = 'ch-card';
                div.tabIndex = 0;
                div.innerText = ch.name;
                div.onclick = () => playChannel(ch.id, div);
                grid.appendChild(div);
            }
        });
    });
}

window.onload = init;
</script>
</body>
</html>
