<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiKON-tv PRO | Smart TV Edition</title>
    <style>
        :root {
            --bg: #020617;
            --sidebar: #0f172a;
            --primary: #2563eb;
            --bein: #7c3aed;
            --arabic: #10b981;
            --doc-color: #f59e0b;
            --accent: #facc15;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: var(--sidebar); padding: 8px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #334155; }
        .search-bar { flex: 1; background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 1rem; }
        
        .player-container { 
            position: relative; 
            width: 100%; 
            background: #000; 
            aspect-ratio: 16/9; 
            max-height: 50vh; 
            border-bottom: 2px solid var(--primary);
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* شعار KiKON-tv الاحترافي لتغطية الإعلانات */
        .app-watermark {
            position: absolute;
            top: 0;
            right: 0;
            width: 38%; 
            height: 25%;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: 900;
            font-size: 1.5rem;
            border-bottom-left-radius: 20px;
            border-left: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
            pointer-events: none;
            box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
        }

        .reload-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 1001;
            font-weight: bold;
        }

        .main-ui { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 160px; background: var(--sidebar); border-left: 2px solid #334155; overflow-y: auto; }
        .group-btn { width: 100%; padding: 15px 8px; background: transparent; border: none; color: #94a3b8; text-align: right; cursor: pointer; font-weight: bold; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        
        /* تأثير التركيز (Focus) لمستخدمي الريموت كنترول */
        .group-btn:focus, .group-btn.active {
            background: var(--primary);
            color: white;
            outline: none;
            border-right: 5px solid var(--accent);
        }

        .group-btn.bein-p { background: var(--bein); color: white; }
        .group-btn.ara-g { background: var(--arabic); color: white; }
        .group-btn.doc-g { background: var(--doc-color); color: #000; }

        .grid { flex: 1; padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; align-content: start; }
        .ch-card { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px 5px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: bold; text-align: center; min-height: 55px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        /* تفعيل تحديد الأزرار بالريموت */
        .ch-card:focus {
            background: var(--primary);
            border-color: var(--accent);
            transform: scale(1.05);
            outline: none;
        }

        .ch-card.active { background: #059669; border-color: white; }

        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:900; }
        .spinner { width: 40px; height: 40px; border: 4px solid #1e293b; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .sidebar { width: 100px; }
            .grid { grid-template-columns: repeat(3, 1fr); }
            .app-watermark { font-size: 1rem; height: 18%; }
        }
    </style>
</head>
<body>

<div class="header">
    <div style="color:var(--accent); font-weight:900;">KiKON-tv</div>
    <input type="text" id="searchBox" class="search-bar" placeholder="بحث..." oninput="doSearch()">
</div>

<div class="player-container">
    <div id="loader"><div class="spinner"></div></div>
    <div class="app-watermark">KiKON-tv</div>
    <button class="reload-btn" onclick="reloadStream()">إصلاح الشاشة السوداء 🔄</button>
    <!-- تم إزالة الـ Sandbox المشدد لضمان العمل على التلفاز -->
    <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media" referrerpolicy="no-referrer"></iframe>
</div>

<div class="main-ui">
    <div class="sidebar" id="side"></div>
    <div class="grid" id="grid"></div>
</div>

<script>
const allData = {
    "🌍 باقة وثائقية": [
        {name:"History USA",id:502},{name:"History 2",id:503},{name:"Discovery Ch",id:504},{name:"Investigation D.",id:505},{name:"Science Ch",id:506},{name:"American Heroes",id:507},{name:"Destination Am",id:508},{name:"Discovery Life",id:509},{name:"Discovery Family",id:510},{name:"Nat Geo USA",id:511},{name:"Nat Geo Wild",id:512},{name:"Smithsonian",id:513},{name:"Animal Planet",id:514},{name:"Travel Ch",id:515},{name:"Food Network",id:516},{name:"HGTV USA",id:517},{name:"Magnolia Net",id:518},{name:"Cooking Ch",id:519},{name:"FYI Channel",id:520}
    ],
    "🇺🇸 USA Sports": [
        {name:"ESPN USA",id:44},{name:"ESPN2 USA",id:45},{name:"NBC USA",id:53},{name:"NFL Net",id:405},{name:"NBA TV",id:404},{name:"MLB Net",id:399},{name:"TSN 1",id:111},{name:"TSN 2",id:112},{name:"TSN 3",id:113},{name:"TSN 4",id:114},{name:"TSN 5",id:115},{name:"Sportsnet ON",id:406},{name:"Tennis Ch",id:40},{name:"TUDN USA",id:66},{name:"RDS CA",id:839}
    ],
    "🟣 beIN Sports": [
        {name:"beIN Sport 1",id:91},{name:"beIN Sport 2",id:92},{name:"beIN Sport 3",id:93},{name:"beIN Sport 4",id:94},{name:"beIN Sport 5",id:95},{name:"beIN Sport 6",id:96},{name:"beIN Sport 7",id:97},{name:"beIN Sport 8",id:98},{name:"beIN Sport 9",id:99},{name:"beIN Eng 1",id:61},{name:"beIN Eng 2",id:90},{name:"beIN XTRA 1",id:100},{name:"beIN MAX AR",id:597}
    ],
    "🟢 Arabic & SSC": [
        {name:"SSC Sport 1",id:614},{name:"SSC Sport 2",id:615},{name:"SSC Sport 3",id:616},{name:"SSC Sport 4",id:617},{name:"SSC Sport 5",id:618},{name:"AD Prem 1",id:609},{name:"AD Prem 2",id:610},{name:"Alkass One",id:781},{name:"Dubai Sp 1",id:604},{name:"OnTime Sp",id:611}
    ],
    "🇺🇸 USA General": [
        {name:"ABC USA",id:51},{name:"CBS USA",id:52},{name:"CW USA",id:300},{name:"AMC USA",id:303},{name:"A&E USA",id:302},{name:"Cinemax",id:374},{name:"Disney Ch",id:312},{name:"CNN USA",id:345},{name:"MTV USA",id:371}
    ]
};

let currentID = 502;
const side = document.getElementById('side');
const grid = document.getElementById('grid');
const player = document.getElementById('mainPlayer');
const loader = document.getElementById('loader');

function init() {
    Object.keys(allData).forEach((cat) => {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        if(cat.includes('beIN')) btn.classList.add('bein-p');
        if(cat.includes('Arabic')) btn.classList.add('ara-g');
        if(cat.includes('وثائقية')) btn.classList.add('doc-g');
        btn.innerText = cat;
        btn.onclick = () => {
            document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid(allData[cat]);
        };
        side.appendChild(btn);
    });
    side.firstChild.click();
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(ch => {
        const div = document.createElement('div');
        div.className = 'ch-card';
        div.tabIndex = 0; // لجعلها قابلة للتحديد بالريموت
        div.innerText = ch.name;
        div.onclick = () => playChannel(ch.id, div);
        div.onkeydown = (e) => { if(e.key === "Enter") playChannel(ch.id, div); };
        grid.appendChild(div);
    });
}

function playChannel(id, el) {
    currentID = id;
    document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    loader.style.display = 'flex';
    
    // إعادة تعيين المشغل بالكامل لحل مشكلة الشاشة السوداء
    player.src = "";
    setTimeout(() => {
        player.src = `https://dlhd.st/embed/stream-${id}.php`;
    }, 50);
    
    setTimeout(() => { loader.style.display = 'none'; }, 2000);
}

function reloadStream() {
    playChannel(currentID, document.querySelector('.ch-card.active'));
}

function doSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    grid.innerHTML = "";
    Object.keys(allData).forEach(k => {
        allData[k].forEach(ch => {
            if(ch.name.toLowerCase().includes(q) || ch.id.toString().includes(q)) {
                const div = document.createElement('div');
                div.className = 'ch-card';
                div.tabIndex = 0;
                div.innerText = ch.name;
                div.onclick = () => playChannel(ch.id, div);
                grid.appendChild(div);
            }
        });
    });
}
window.onload = init;
</script>
</body>
</html>
