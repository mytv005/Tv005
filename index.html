<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LovooTV | FULL 189 CHANNELS</title>
    <style>
        :root {
            --bg: #020617;
            --sidebar: #0f172a;
            --primary: #2563eb;
            --bein: #7c3aed;
            --arabic: #10b981;
            --doc: #f59e0b;
            --accent: #facc15;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: var(--sidebar); padding: 8px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #334155; flex-shrink: 0; height: 55px; }
        .search-bar { flex: 1; background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 1rem; }
        
        .player-area { position: relative; width: 100%; background: #000; flex: 0 0 55vh; border-bottom: 3px solid var(--primary); overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        .kikon-shield {
            position: absolute;
            top: 0; right: 0;
            width: 38%; height: 26%;
            background: linear-gradient(145deg, #0f172a, #020617);
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-weight: 900; font-size: 1.4rem;
            border-bottom-left-radius: 25px;
            border-left: 3px solid var(--primary); border-bottom: 3px solid var(--primary);
            pointer-events: none;
            box-shadow: -10px 10px 25px rgba(0,0,0,0.9);
        }

        #adBreaker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            background: rgba(0,0,0,0.01);
            cursor: pointer;
            display: none;
        }

        .main-ui { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 170px; background: var(--sidebar); border-left: 2px solid #334155; overflow-y: auto; height: 100%; }
        .group-btn { width: 100%; padding: 16px 12px; background: transparent; border: none; color: #94a3b8; text-align: right; cursor: pointer; font-weight: bold; border-bottom: 1px solid #334155; font-size: 0.85rem; }
        .group-btn.active { background: var(--primary); color: white; border-right: 5px solid var(--accent); }
        .group-btn.bein-p { background: var(--bein); color: white; }
        .group-btn.ara-g { background: var(--arabic); color: white; }
        .group-btn.doc-g { background: var(--doc); color: #000; }

        .grid-container { flex: 1; height: 100%; overflow-y: auto; padding: 10px; position: relative; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; padding-bottom: 40px; }
        
        .ch-card { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px 5px; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: bold; text-align: center; min-height: 55px; display: flex; align-items: center; justify-content: center; }
        .ch-card.active { background: #059669; border-color: white; }

        #keypadLock {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pin-display { font-size: 2rem; letter-spacing: 15px; margin-bottom: 20px; color: var(--accent); }
        .key-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .key { width: 60px; height: 60px; background: #1e293b; border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; }

        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:900; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .sidebar { width: 110px; } .grid { grid-template-columns: repeat(3, 1fr); } .kikon-shield { font-size: 1rem; width: 45%; } }
    </style>
</head>
<body>

<div class="header">
    <div style="color:var(--accent); font-weight:900;">KiKON-tv</div>
    <input type="text" id="searchBox" class="search-bar" placeholder="بحث في 189 قناة..." oninput="doSearch()">
</div>

<div class="player-area">
    <div id="loader"><div style="border:3px solid #fff; border-top:3px solid var(--primary); border-radius:50%; width:30px; height:30px; animation: spin 1s linear infinite;"></div></div>
    <div class="kikon-shield">KiKON-tv</div>
    <div id="adBreaker" onclick="this.style.display='none'"></div>
    <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer"></iframe>
</div>

<div class="main-ui">
    <div class="sidebar" id="side"></div>
    <div class="grid-container">
        <div id="keypadLock">
            <p style="margin-bottom:10px; color:var(--doc)">أدخل الرمز 0000</p>
            <div class="pin-display" id="pinDots">----</div>
            <div class="key-row">
                <div class="key" onclick="pressKey('1')">1</div>
                <div class="key" onclick="pressKey('2')">2</div>
                <div class="key" onclick="pressKey('3')">3</div>
            </div>
            <div class="key-row">
                <div class="key" onclick="pressKey('4')">4</div>
                <div class="key" onclick="pressKey('5')">5</div>
                <div class="key" onclick="pressKey('6')">6</div>
            </div>
            <div class="key-row">
                <div class="key" onclick="pressKey('7')">7</div>
                <div class="key" onclick="pressKey('8')">8</div>
                <div class="key" onclick="pressKey('9')">9</div>
            </div>
            <div class="key-row">
                <div class="key" onclick="pressKey('0')">0</div>
            </div>
        </div>
        <div class="grid" id="grid"></div>
    </div>
</div>

const side = document.getElementById('side');
const grid = document.getElementById('grid');
const player = document.getElementById('mainPlayer');
const loader = document.getElementById('loader');
const adBreaker = document.getElementById('adBreaker');
const keypadLock = document.getElementById('keypadLock');
const pinDots = document.getElementById('pinDots');

let currentPin = "";
let currentCategory = "";
let isUnlocked = false;

function init() {
    Object.keys(allData).forEach((cat) => {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        if(cat.includes('beIN')) btn.classList.add('bein-p');
        if(cat.includes('Arabic')) btn.classList.add('ara-g');
        if(cat.includes('وثائقية')) btn.classList.add('doc-g');
        btn.innerText = cat;
        btn.onclick = () => selectGroup(cat, btn);
        side.appendChild(btn);
    });
    side.firstChild.click();
}

function selectGroup(cat, btn) {
    document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = cat;
    currentPin = "";
    pinDots.innerText = "----";

    if (cat.includes('وثائقية') && !isUnlocked) {
        grid.style.display = 'none';
        keypadLock.style.display = 'flex';
    } else {
        keypadLock.style.display = 'none';
        grid.style.display = 'grid';
        renderGrid(allData[cat]);
    }
}

function pressKey(num) {
    currentPin += num;
    pinDots.innerText = "*".repeat(currentPin.length) + "-".repeat(4 - currentPin.length);
    if (currentPin === "0000") {
        isUnlocked = true;
        keypadLock.style.display = 'none';
        grid.style.display = 'grid';
        renderGrid(allData[currentCategory]);
    } else if (currentPin.length >= 4) {
        currentPin = "";
        pinDots.innerText = "----";
    }
}

function renderGrid(list) {
    grid.innerHTML = "";
    list.forEach(ch => {
        const div = document.createElement('div');
        div.className = 'ch-card';
        div.innerText = ch.name;
        div.onclick = () => playChannel(ch.id, div);
        grid.appendChild(div);
    });
}

function playChannel(id, el) {
    document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    loader.style.display = 'flex';
    adBreaker.style.display = 'block';
    player.src = "https://dlhd.st/embed/stream-" + id + ".php";
    setTimeout(() => { loader.style.display = 'none'; }, 1500);
}

function doSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    keypadLock.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = "";
    Object.keys(allData).forEach(k => {
        allData[k].forEach(ch => {
            if(ch.name.toLowerCase().includes(q)) {
                const div = document.createElement('div');
                div.className = 'ch-card';
                div.innerText = ch.name;
                div.onclick = () => playChannel(ch.id, div);
                grid.appendChild(div);
            }
        });
    });
}

window.onload = init;
</script>
