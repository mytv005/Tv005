<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiver Pro V10 - Organized Edition</title>
    
    <style>
        :root {
            --bg: #020617;
            --panel: #0f172a;
            --sidebar-bg: #1e293b;
            --primary: #2563eb;
            --bein-purple: #7c3aed;
            --text: #f8fafc;
            --accent: #facc15;
            --arabic-green: #14b8a6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* قسم المشغل */
        .player-section {
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            max-height: 45vh;
            position: relative;
            border-bottom: 3px solid var(--primary);
        }

        iframe { width: 100%; height: 100%; border: none; }

        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #1e293b; border-top-color: var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* الواجهة الرئيسية */
        .main-ui {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* القائمة الجانبية للباقات */
        .sidebar {
            width: 200px;
            background: var(--sidebar-bg);
            border-left: 2px solid #334155;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .group-btn {
            padding: 18px 12px;
            background: transparent;
            border: none;
            color: #94a3b8;
            text-align: right;
            cursor: pointer;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .group-btn:focus, .group-btn.active {
            background: var(--primary);
            color: white;
            outline: none;
            border-right: 5px solid var(--accent);
        }

        .group-btn.bein-group { background: var(--bein-purple); color: white; }
        .group-btn.bein-group.active { background: #9333ea; }

        .group-btn.arabic-group { background: var(--arabic-green); color: white; }
        .group-btn.arabic-group.active { background: #0f766e; }

        /* شبكة القنوات */
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            align-content: start;
        }

        .ch-btn {
            background: #334155;
            border: 2px solid transparent;
            color: white;
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .ch-btn:focus {
            background: var(--primary);
            border-color: var(--accent);
            transform: scale(1.1);
            outline: none;
        }

        .ch-btn.active {
            background: #10b981;
            border-color: white;
        }

        @media (max-width: 600px) {
            .sidebar { width: 120px; font-size: 0.8rem; }
            .content { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="player-section">
        <div id="loader"><div class="spinner"></div><p style="color:white; margin-top:10px;">جاري تحميل البث...</p></div>
        <iframe id="mainPlayer" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" referrerpolicy="no-referrer"></iframe>
    </div>

        <div class="sidebar" id="sidebar"></div>
        <div class="content" id="channelsGrid"></div>

            ]
        };

        const finalGroups = [];

        // الترتيب والتنظيم:
        // 1. استخراج beIN
        const beinList = rawData["Arabic Channels & SSC Sport (MENA)"].filter(ch => ch.name.toLowerCase().includes('bein'));
        finalGroups.push({ name: "🟣 beIN Sports", channels: beinList, type: 'bein' });

        // 2. الباقة الغربية الرياضية
        finalGroups.push({ name: "🇺🇸 USA Sports", channels: rawData["USA & Canada Sports Networks"] });

        // 3. تقسيم الباقة الغربية العامة إلى جزئين
        const generalList = rawData["USA & Canada (General, Movies & Documentaries)"];
        const half = Math.ceil(generalList.length / 2);
        finalGroups.push({ name: "🎬 USA General P1", channels: generalList.slice(0, half) });
        finalGroups.push({ name: "🎬 USA General P2", channels: generalList.slice(half) });

        // 4. الباقة العربية و SSC (بدون beIN)
        const arabicList = rawData["Arabic Channels & SSC Sport (MENA)"].filter(ch => !ch.name.toLowerCase().includes('bein'));
        finalGroups.push({ name: "🟢 Arabic & SSC", channels: arabicList, type: 'arabic' });

        function initApp() {
            finalGroups.forEach((group, idx) => {
                const btn = document.createElement('button');
                btn.className = `group-btn ${group.type === 'bein' ? 'bein-group' : ''} ${group.type === 'arabic' ? 'arabic-group' : ''}`;
                btn.innerText = group.name;
                btn.onclick = () => selectGroup(idx);
                sidebar.appendChild(btn);
            });

            // تحميل الحالة الأخيرة
            if (!currentChId && finalGroups[0].channels.length > 0) currentChId = finalGroups[0].channels[0].id;
            const startGroup = finalGroups.findIndex(g => g.channels.some(c => c.id == currentChId)) || 0;
            selectGroup(startGroup >= 0 ? startGroup : 0);
        }

        function selectGroup(idx) {
            activeGroupIdx = idx;
            document.querySelectorAll('.group-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            grid.innerHTML = "";
            finalGroups[idx].channels.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = `ch-btn ${ch.id == currentChId ? 'active' : ''}`;
                btn.innerText = ch.name;
                btn.id = `ch-${ch.id}`;
                btn.onclick = () => loadStream(ch.id, btn);
                grid.appendChild(btn);
            });
        }

        function loadStream(id, btn) {
            currentChId = id;
            localStorage.setItem('last_ch_v10', id);
            document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            loader.style.display = 'flex';
            player.src = "about:blank";
            setTimeout(() => { player.src = `${BASE_URL}${id}.php`; }, 200);
            setTimeout(() => { loader.style.display = 'none'; }, 2000);
        }

        // تحسين التنقل بالريموت
        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            const sBtns = Array.from(document.querySelectorAll('.group-btn'));
            const cBtns = Array.from(document.querySelectorAll('.ch-btn'));

            if (e.key === 'ArrowDown') {
                if (sBtns.includes(active)) sBtns[sBtns.indexOf(active) + 1]?.focus();
                else if (cBtns.includes(active)) {
                    const cols = window.getComputedStyle(grid).gridTemplateColumns.split(' ').length;
                    cBtns[cBtns.indexOf(active) + cols]?.focus();
                }
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                if (sBtns.includes(active)) sBtns[sBtns.indexOf(active) - 1]?.focus();
                else if (cBtns.includes(active)) {
                    const cols = window.getComputedStyle(grid).gridTemplateColumns.split(' ').length;
                    cBtns[cBtns.indexOf(active) - cols]?.focus();
                }
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                if (sBtns.includes(active)) cBtns[0]?.focus();
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                if (cBtns.includes(active)) sBtns[activeGroupIdx].focus();
                e.preventDefault();
            }
        });

        window.onload = initApp;
    </script>
</body>
</html>
