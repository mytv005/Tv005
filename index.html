<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiKON-tv ULTRA V69</title>
    <style>
        :root {
            --bg: #030712;
            --sidebar-bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #2563eb;
            --accent: #facc15;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --focus-border: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        *:focus {
            outline: 3px solid var(--focus-border) !important;
            outline-offset: 1px;
            z-index: 100;
        }

        /* Top Bar */
        .header { background: var(--sidebar-bg); padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #334155; flex-shrink: 0; height: 50px; }
        .logo { color: var(--accent); font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; }
        .search-bar { flex: 1; background: #1e293b; border: 1px solid #475569; color: #ffffff; padding: 6px 12px; border-radius: 6px; outline: none; font-size: 0.85rem; }
        .view-btn { background: #1e293b; color: #ffffff; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .view-btn.active { background: var(--primary); border-color: var(--accent); color: #ffffff; }

        /* Video Area */
        .player-area { position: relative; width: 100%; background: #000; flex: 0 0 38vh; border-bottom: 3px solid var(--primary); display: flex; flex-direction: column; transition: flex 0.3s ease; }
        
        .player-area.cinema-mode { flex: 0 0 65vh; z-index: 40; }
        
        iframe { width: 100%; flex: 1; border: none; background: #000; position: relative; z-index: 1; }

        /* غطاء الشعار */
        .kikon-shield {
            position: absolute; 
            top: 0; 
            right: 0; 
            width: 380px; 
            height: 135px; 
            background: #0f172a; 
            z-index: 25; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: var(--accent); 
            font-weight: 900; 
            font-size: 1.1rem; 
            border-bottom-left-radius: 16px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: -4px 4px 16px rgba(0,0,0,0.85);
        }

        /* Player Controls */
        .player-controls {
            height: 48px; background: #0b1329; border-top: 2px solid #1e293b;
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 6px; flex-shrink: 0; z-index: 30;
        }

        .control-group { display: flex; align-items: center; gap: 6px; }
        .ctrl-btn { 
            background: #1e293b; color: #ffffff; border: 1px solid #475569; 
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; 
            display: flex; align-items: center; gap: 4px; white-space: nowrap; transition: 0.2s;
        }
        .ctrl-btn:hover, .ctrl-btn:focus { background: var(--primary); border-color: var(--accent); }

        /* Layout & Expanded Sidebar */
        .main-ui { flex: 1; display: flex; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar-bg); border-left: 2px solid #334155; display: flex; flex-direction: column; height: 100%; flex-shrink: 0; }
        
        /* أزرار التنقل بالماوس */
        .nav-scroll-btn {
            background: #1e293b;
            color: var(--accent);
            border: none;
            border-bottom: 1px solid #334155;
            border-top: 1px solid #334155;
            padding: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .nav-scroll-btn:hover { background: #334155; color: #ffffff; }

        #regSide { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        #regSide::-webkit-scrollbar { width: 5px; }
        #regSide::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .secret-box-btn { width: 100%; height: 24px; background: #0f172a; cursor: pointer; border: none; flex-shrink: 0; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: center; }
        .secret-square { width: 12px; height: 12px; background: #334155; border-radius: 2px; }
        .secret-box-btn.active .secret-square { background: #f43f5e; box-shadow: 0 0 8px #f43f5e; }

        /* Package Buttons */
        .group-btn { 
            width: 100%; padding: 12px 10px; border: 1px solid #334155; border-radius: 8px; 
            color: #ffffff; text-align: right; cursor: pointer; font-weight: bold; font-size: 0.85rem; 
            background: #1e293b; transition: 0.2s; flex-shrink: 0;
        }
        .group-btn:hover { background: #334155; }
        .group-btn.active { background: var(--primary) !important; color: #ffffff !important; border-color: var(--accent) !important; border-right: 5px solid var(--accent); }

        .grid-container { flex: 1; height: 100%; overflow-y: auto; padding: 10px; position: relative; background: var(--bg); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; padding-bottom: 30px; }
        
        /* Channel Card Base */
        .ch-card { 
            position: relative; color: #ffffff; border: 1px solid #334155; padding: 10px 6px; 
            border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: bold; 
            text-align: center; min-height: 56px; display: flex; align-items: center; 
            justify-content: center; word-break: break-word; user-select: none; overflow: hidden;
            background: #1e293b; transition: 0.15s;
        }
        .ch-card.active { background: linear-gradient(135deg, #059669, #10b981) !important; border-color: #ffffff !important; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        /* Keypad Screen */
        #keypadLock { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .pin-display { font-size: 2.2rem; letter-spacing: 12px; margin-bottom: 15px; color: var(--accent); font-weight: bold; }
        .key-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .key { width: 60px; height: 55px; background: #1e293b; border: 2px solid var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; cursor: pointer; color: #ffffff; }

        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:900; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .matches-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-sub); gap: 10px; text-align: center; font-size: 1rem; }

        @media (max-width: 600px) { 
            .sidebar { width: 150px; } 
            .grid { grid-template-columns: repeat(2, 1fr); } 
            .player-area { flex: 0 0 34vh; }
            .player-area.cinema-mode { flex: 0 0 58vh; }
            .ctrl-btn { padding: 5px 6px; font-size: 0.7rem; }
            .kikon-shield { width: 70%; height: 115px; font-size: 0.85rem; }
        }
    </style>
</head>

const regSide = document.getElementById('regSide');
const grid = document.getElementById('grid');
const player = document.getElementById('mainPlayer');
const playerContainer = document.getElementById('playerContainer');
const loader = document.getElementById('loader');
const secretBtn = document.getElementById('secretLock');
const keypad = document.getElementById('keypadLock');
const pinDots = document.getElementById('pinDots');
const playPauseBtn = document.getElementById('playPauseBtn');
const matchesContainer = document.getElementById('matchesContainer');

let pin = "";
let currentCat = localStorage.getItem('kikon_cat') || channelsData[0].category;
let savedSrc = localStorage.getItem('kikon_last_src') || "";
let currentChannelIndex = -1;

function scrollSidebar(offset) {
    regSide.scrollBy({ top: offset, behavior: 'smooth' });
}

function init() {
    regSide.innerHTML = "";
    channelsData.forEach((group) => {
        if(group.category === "🔒 Secret Box") return;
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        btn.tabIndex = 0;
        btn.innerText = group.category;
        btn.onclick = () => selectCat(group.category, btn);
        regSide.appendChild(btn);
    });

    const activeBtn = Array.from(regSide.children).find(b => b.innerText === currentCat);
    if(activeBtn && currentCat !== "🔒 Secret Box") {
        selectCat(currentCat, activeBtn);
    } else {
        if(regSide.firstChild) regSide.firstChild.click();
    }

    if(savedSrc) player.src = savedSrc;
}

function switchView(mode) {
    viewMode = mode;
    document.getElementById('btnCh').classList.toggle('active', mode === 'channels');
    document.getElementById('btnMatches').classList.toggle('active', mode === 'matches');
    if(mode === 'channels') {
        grid.style.display = 'grid';
        matchesContainer.style.display = 'none';
        document.getElementById('side').style.display = 'flex';
    } else {
        grid.style.display = 'none';
        keypad.style.display = 'none';
        matchesContainer.style.display = 'block';
        document.getElementById('side').style.display = 'none';
    }
}

function selectCat(catName, btn) {
    isUnlockedThisSession = false;
    secretBtn.classList.remove('active');
    
    document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    currentCat = catName;
    localStorage.setItem('kikon_cat', catName);
    keypad.style.display = 'none'; 
    grid.style.display = 'grid';
    
    const catData = channelsData.find(c => c.category === catName);
    renderGrid(catData ? catData.channels : []);
}

function openSecret() {
    document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
    secretBtn.classList.add('active');
    currentCat = "🔒 Secret Box";
    
    const secretData = channelsData.find(c => c.category === "🔒 Secret Box");
    
    if(!isUnlockedThisSession) {
        grid.style.display = 'none'; 
        keypad.style.display = 'flex'; 
        cls();
    } else {
        grid.style.display = 'grid'; 
        renderGrid(secretData ? secretData.channels : []);
    }
}

document.addEventListener('keydown', (e) => {
    if (keypad.style.display === 'flex') {
        if (e.key >= '0' && e.key <= '9') {
            press(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
            cls();
        }
    }
});

function press(n) {
    if(pin.length < 4) { 
        pin += n; 
        pinDots.innerText = "*".repeat(pin.length) + "-".repeat(4 - pin.length); 
    }
    if(pin === SECRET_PIN) {
        isUnlockedThisSession = true;
        keypad.style.display = 'none'; 
        grid.style.display = 'grid';
        const secretData = channelsData.find(c => c.category === "🔒 Secret Box");
        renderGrid(secretData ? secretData.channels : []);
    } else if (pin.length >= 4) { 
        setTimeout(cls, 300); 
    }
}

function cls() { pin = ""; pinDots.innerText = "----"; }

function renderGrid(list) {
    grid.innerHTML = "";
    if(!list) return;
    list.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = 'ch-card'; 
        div.innerText = ch.name; 
        div.tabIndex = 0;
        
        if(savedSrc && savedSrc.includes("stream-" + ch.id + ".php")) {
            div.classList.add('active');
            currentChannelIndex = idx;
        }

        div.onclick = () => { currentChannelIndex = idx; playChannel(ch.id, div); };
        grid.appendChild(div);
    });
}

function playChannel(id, el) {
    document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('active'));
    if(el) el.classList.add('active');
    loader.style.display = 'flex';
    savedSrc = "https://dlhd.st/embed/stream-" + id + ".php";
    localStorage.setItem('kikon_last_src', savedSrc);
    player.src = savedSrc;
    playPauseBtn.innerText = "⏸️ إيقاف";
    setTimeout(() => { loader.style.display = 'none'; }, 800);
}

function togglePlayPause() {
    if (player.src !== "") { savedSrc = player.src; player.src = ""; playPauseBtn.innerText = "▶️ تشغيل"; }
    else if (savedSrc !== "") { player.src = savedSrc; playPauseBtn.innerText = "⏸️ إيقاف"; }
}

function reloadChannel() {
    if (savedSrc) { loader.style.display = 'flex'; player.src = savedSrc; setTimeout(() => { loader.style.display = 'none'; }, 800); }
}

function nextChannel() {
    const catData = channelsData.find(c => c.category === currentCat);
    const list = catData ? catData.channels : [];
    if (!list || list.length === 0) return;
    currentChannelIndex = (currentChannelIndex + 1) % list.length;
    playChannel(list[currentChannelIndex].id, grid.children[currentChannelIndex]);
}

function prevChannel() {
    const catData = channelsData.find(c => c.category === currentCat);
    const list = catData ? catData.channels : [];
    if (!list || list.length === 0) return;
    currentChannelIndex = (currentChannelIndex - 1 + list.length) % list.length;
    playChannel(list[currentChannelIndex].id, grid.children[currentChannelIndex]);
}

function toggleCinemaMode() { playerContainer.classList.toggle('cinema-mode'); }
function toggleFullScreen() {
    if (!document.fullscreenElement) { playerContainer.requestFullscreen ? playerContainer.requestFullscreen() : playerContainer.webkitRequestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
}

function doSearch() {
    const q = document.getElementById('searchBox').value.toLowerCase().trim();
    if (q === "") { 
        const activeBtn = document.querySelector('.group-btn.active');
        if(activeBtn) activeBtn.click();
        else selectCat(currentCat);
        return; 
    }
    keypad.style.display = 'none'; 
    grid.style.display = 'grid'; 
    grid.innerHTML = "";
    
    channelsData.forEach(group => {
        if(group.category === "🔒 Secret Box" && !isUnlockedThisSession) return;
        group.channels.forEach(ch => {
            if(ch.name.toLowerCase().includes(q)) {
                const div = document.createElement('div');
                div.className = 'ch-card'; 
                div.innerText = ch.name; 
                div.tabIndex = 0;
                div.onclick = () => playChannel(ch.id, div);
                grid.appendChild(div);
            }
        });
    });
}

window.onload = init;
